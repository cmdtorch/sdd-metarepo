name: template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Render the examples and run the generated checks
        run: tests/render.sh
        env:
          MISE_YES: "1"
          # mise downloads the generated project's tools from GitHub releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
